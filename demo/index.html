<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BJJ Scoreboard demo</title>
    <meta
      name="description"
      content="Demo of bjj-scoreboard, a free IBJJF BJJ scoreboard web component with points, advantages, penalties, automatic tiebreaks, and a match clock."
    />
    <link rel="canonical" href="https://grappleflows.com/bjj-scoreboard" />
    <style>
      :root {
        color-scheme: light;
        --ink: #18181b;
        --muted: #5f5f68;
        --bg: #faf9f6;
        --line: #e7e5e4;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 28px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      a {
        color: inherit;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0 8px;
      }
      .controls button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      pre {
        min-height: 3em;
        max-height: 180px;
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        font-size: 13px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BJJ Scoreboard demo</h1>
      <p>
        This is the <code>bjj-scoreboard</code> web component running from <code>../dist</code>. Run
        <code>npm run build</code> first. The same scoreboard is hosted at
        <a href="https://grappleflows.com/bjj-scoreboard">grappleflows.com/bjj-scoreboard</a>.
      </p>

      <bjj-scoreboard id="demo" belt="blue" name-a="Ana" name-b="Bea" global-keys>
        <a slot="credit" href="https://grappleflows.com/bjj-scoreboard?utm_source=github&amp;utm_medium=referral&amp;utm_campaign=bjj-scoreboard&amp;ref=github">Free BJJ scoreboard by Grapple Flows</a>
      </bjj-scoreboard>

      <div class="controls">
        <button type="button" data-demo="theme">Toggle dark theme</button>
        <button type="button" data-demo="result">Log getResult()</button>
      </div>
      <pre id="events" aria-label="Event log"></pre>
    </main>

    <script src="../dist/bjj-scoreboard.min.js"></script>
    <script>
      const board = document.getElementById("demo");
      const out = document.getElementById("events");
      const log = (line) => {
        out.textContent = `${line}\n${out.textContent}`.slice(0, 4000);
      };
      board.addEventListener("bjj-scoreboard:score", (event) => log(`score: ${event.detail.action} -> ${event.detail.status.text}`));
      board.addEventListener("bjj-scoreboard:end", (event) => log(`end: ${event.detail.text}`));
      board.addEventListener("bjj-scoreboard:clock", (event) =>
        log(`clock: ${event.detail.running ? "running" : "stopped"}, ${Math.ceil(event.detail.remaining)}s left`),
      );
      document.querySelector('[data-demo="theme"]').addEventListener("click", () => {
        board.setAttribute("theme", board.getAttribute("theme") === "dark" ? "light" : "dark");
      });
      document.querySelector('[data-demo="result"]').addEventListener("click", () => {
        log(JSON.stringify(board.getResult(), null, 2));
      });
    </script>
  </body>
</html>
